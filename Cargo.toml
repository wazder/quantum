[workspace]
resolver = "2"
members = [
    "crates/quantum-core",
    "crates/quantum-loader",
    "crates/quantum-jit",
    "crates/quantum-ntdll",
    "crates/quantum-kernel32",
    "crates/quantum-cli",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/wazder/quantum"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_safety_doc = "deny"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 1
